<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprint Coach</title>
<meta name="theme-color" content="#C2412A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprint Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column training log with a bottom tab bar; track-tartan accent on cool lane-line neutrals */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --sunk:#E3E8EC; --ink:#13202B; --muted:#5A6874; --line:#D3DAE0;
  --accent:#C2412A; --accent-ink:#FFFFFF; --accent-soft:#F6E1DC; --good:#2F7D55; --warn:#A86A12; --bad:#B3261E;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-acc:#E08A2E; --t-maxv:#D6453A; --t-se:#9358C9; --t-spe:#3C7BD0; --t-lac:#5A55C2; --t-tempo:#3B9A63;
  --t-rec:#2E9AA0; --t-race:#C2412A; --t-rest:#8A96A0; --t-hurdle:#C79A1E; --t-gym:#6B7785;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E151B; --surface:#17212A; --sunk:#1F2B35; --ink:#E7ECF0; --muted:#94A2AD; --line:#2A3743;
  --accent:#E2603F; --accent-ink:#1A0E0A; --accent-soft:#3A2019; --good:#5DBE8A; --warn:#E0A54A; --bad:#F2867D;
  --t-gym:#9AA6B2; color-scheme:dark }}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600;min-height:44px;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.link{border:none;background:none;padding:6px 4px;min-height:0;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;flex:none;padding:0;margin:2px 0 0;accent-color:var(--accent)}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:500;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border-radius:999px;padding:8px 16px;font-family:var(--display);font-size:19px;font-weight:700}
.chip-btn.sm{font-family:var(--body);font-size:14px;font-weight:600;padding:6px 14px;min-height:38px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;min-width:44px;padding:8px 10px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.pill.good{background:color-mix(in srgb,var(--good) 18%,var(--surface))}

/* header */
.appbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.who{display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 14px 6px 6px;min-height:44px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--muted)}

/* season strip */
.strip{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;position:relative}
.strip span{display:block;height:100%;min-width:3px}
.strip-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.strip-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* week */
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{min-width:44px;padding:8px 12px}
.days{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.day{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;padding:12px 14px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;text-align:left;min-height:68px;font-weight:400;width:100%}
.day:last-child{border-bottom:none}
.day.today{background:var(--accent-soft)}
.dname{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;text-transform:uppercase}
.ddate{font-size:12px;color:var(--muted)}
.dmain{min-width:0;display:flex;flex-direction:column;gap:6px}
.dtitle{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--t-rest))}
.dot.sq{border-radius:3px}
.dsub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.why{font-size:13px;color:var(--warn)}
.status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.status.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.status.changed{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.status.skipped{text-decoration:line-through}
.statuses{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}

/* check-in */
.ci-row{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}
.ci-row .seg{width:100%;display:grid;grid-template-columns:repeat(5,1fr)}

/* records */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rec.main{border-color:var(--accent)}
.rec .ev{font-family:var(--display);font-size:22px;font-weight:700}
.rec .t{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.marks{border-collapse:collapse;width:100%;font-size:14px}
.marks th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.marks td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.pb{background:var(--accent);color:var(--accent-ink)}

/* insights */
.finding{display:grid;grid-template-columns:4px 1fr;gap:12px}
.finding .bar{border-radius:2px;background:var(--c,var(--accent))}
.ratio{font-family:var(--display);font-size:20px;font-weight:600}
.focus-bars{display:flex;flex-direction:column;gap:8px}
.fb{display:grid;grid-template-columns:150px 1fr 24px;gap:10px;align-items:center;font-size:13px}
.fb .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.fb .fill{height:100%;background:var(--c);border-radius:5px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2;fill:none}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt.hit{fill:transparent;stroke:none}
.tip{font-size:13px;min-height:20px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:780px;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.box{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rep{display:grid;grid-template-columns:24px 1fr 1fr 1fr 1fr 34px;gap:6px;align-items:end}
.rep .n{font-family:var(--display);font-weight:700;font-size:18px;padding-bottom:10px;color:var(--muted)}
.rep input{padding:8px;min-height:40px}
.rep button{min-height:40px;padding:0;border:none;background:none;color:var(--muted);font-size:22px}
@media (max-width:520px){.rep{grid-template-columns:20px 1fr 1fr 1fr 1fr 28px}.rep label{font-size:11px}}
.parsed{font-size:13px;color:var(--good)}
.parsed.none{color:var(--muted)}
hr{border:none;border-top:1px solid var(--line);margin:4px 0}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:none;background:none;font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 2px}
.tabs button[aria-current="page"]{color:var(--accent)}
@media (max-width:440px){.tabs button{font-size:13px;letter-spacing:.02em}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.sync{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden aria-label="Sections"><div class="tabs-in">
  <button id="tab-week" data-tab="week">Week</button>
  <button id="tab-races" data-tab="races">Races</button>
  <button id="tab-records" data-tab="records">Records</button>
  <button id="tab-insights" data-tab="insights">Insights</button>
  <button id="tab-settings" data-tab="settings">Settings</button>
</div></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* =========================================================
   Sprint Coach v2: rules-based sprint & hurdles planner.
   Runs entirely on the device; no AI, no server.
   ========================================================= */
const DATA_VERSION=2;

/* ---------- events ---------- */
const EVENTS=["60m","100m","200m","300m","400m","60mH","70mH","75mH","80mH","100mH","110mH","300mH","400mH"];
const WIND_EVENTS=new Set(["100m","200m","70mH","75mH","80mH","100mH","110mH"]);
const LONG_EVENTS=new Set(["300m","400m","300mH","400mH"]);
const MAIN_EVENTS=[{k:"100m",n:"100m"},{k:"200m",n:"200m"},{k:"400m",n:"400m"},{k:"SH",n:"Sprint hurdles"},{k:"400mH",n:"400m hurdles"}];
const SEC_EVENTS=[{k:"60m",n:"60m"},...MAIN_EVENTS];
const SH_RACES=["70mH","75mH","80mH","100mH","110mH"],LH_RACES=["300mH","400mH"];
function hurdleRace(p,ev){if(ev==="SH")return p.hRace||(p.sex==="F"?"100mH":"110mH");if(ev==="400mH")return p.hRaceLong||"400mH";return null;}
function evName(p,k){return hurdleRace(p,k)||k;}
function mainName(p){return evName(p,p.event);}
function famOf(k){return({"60m":"100","100m":"100","200m":"200","400m":"400","SH":"SH","400mH":"400H"})[k]||"400";}
function fam(p){return famOf(p.event);}
function allEvents(p){return [p.event,...(p.secondaries||[])].filter(Boolean);}
function hurdleEv(p){return allEvents(p).find(e=>e==="SH"||e==="400mH")||null;}
function isHurdler(p){return !!hurdleEv(p);}
function eventLabel(p){const sec=(p.secondaries||[]).map(k=>evName(p,k));return mainName(p)+(sec.length?" (+"+sec.join(", ")+")":"");}

/* ---------- age groups (UK Athletics, from 1 April 2026) ---------- */
// U10–U18: two-year bands by age on 31 August in the competition year (1 Oct–30 Sep).
// U20: 18+ on 31 August and under 20 on 31 December. Senior: 20+ on 31 December.
// Masters: 35+ on the day of competition, in five-year bands.
function ageOn(dob,date){const b=parseISO(dob);if(!b)return null;let a=date.getFullYear()-b.getFullYear();if(date.getMonth()<b.getMonth()||(date.getMonth()===b.getMonth()&&date.getDate()<b.getDate()))a--;return a;}
function ageGroup(p,date){
  date=date||new Date();if(!p.dob)return null;const age=ageOn(p.dob,date);if(age==null||age<0)return null;
  if(age>=35){const band=Math.floor(age/5)*5;return{code:(p.sex==="F"?"W":"M")+band,age,masters:true};}
  const dec=ageOn(p.dob,new Date(date.getFullYear(),11,31));
  const augComp=ageOn(p.dob,new Date(date.getMonth()>=9?date.getFullYear()+1:date.getFullYear(),7,31));
  const augCal=ageOn(p.dob,new Date(date.getFullYear(),7,31));
  if(dec>=20)return{code:dec<=22?"U23":"Senior",age,senior:true};
  if(augComp>=18||augCal>=18)return{code:"U20",age,u20:true};
  for(const [min,c] of [[16,"U18"],[14,"U16"],[12,"U14"],[10,"U12"],[0,"U10"]])if(augComp>=min)return{code:c,age,youth:true,young:min<=14};
  return null;
}
function agLabel(p){const a=ageGroup(p);return a?a.code:"";}

/* ---------- session types ---------- */
const TYPES={
  acc:{name:"Acceleration",c:"var(--t-acc)",hi:true,speed:true},
  maxv:{name:"Max Velocity",c:"var(--t-maxv)",hi:true,speed:true},
  se:{name:"Speed Endurance",c:"var(--t-se)",hi:true},
  spe:{name:"Special Endurance",c:"var(--t-spe)",hi:true},
  lac:{name:"Lactic Tolerance",c:"var(--t-lac)",hi:true},
  hStart:{name:"Hurdle Starts",c:"var(--t-hurdle)",hi:true,hurdle:true,speed:true},
  hRhythm:{name:"Hurdle Rhythm",c:"var(--t-hurdle)",hi:true,hurdle:true,speed:true},
  hSE:{name:"Hurdle Speed Endurance",c:"var(--t-hurdle)",hi:true,hurdle:true,speed:true},
  hStride:{name:"Stride Pattern",c:"var(--t-hurdle)",hi:true,hurdle:true,speed:true},
  hDrills:{name:"Hurdle Drills",c:"var(--t-hurdle)",hi:false,hurdle:true},
  tempo:{name:"Tempo",c:"var(--t-tempo)",hi:false},
  rec:{name:"Recovery",c:"var(--t-rec)",hi:false},
  race:{name:"Race",c:"var(--t-race)",hi:true},
  rest:{name:"Rest",c:"var(--t-rest)",hi:false},
  none:{name:"No session entered",c:"var(--t-rest)",hi:false}
};
const ORDER=["acc","maxv","hStart","hRhythm","se","hStride","hSE","spe","lac"];
const LOGGABLE=["acc","maxv","se","spe","lac","hStart","hRhythm","hSE","hStride","hDrills","tempo","rec","race"];
const PHASES={
  gpp:{name:"General Preparation",short:"GPP",c:"var(--t-tempo)"},
  spp:{name:"Specific Preparation",short:"SPP",c:"var(--t-se)"},
  comp:{name:"Competition",short:"Comp",c:"var(--t-race)"},
  trans:{name:"Transition",short:"Trans",c:"var(--t-rest)"}
};
/* base emphasis of quality work by event family and phase */
const EMPH={
  "100":{gpp:{acc:3,maxv:1.5,se:1.2,spe:.3},spp:{acc:2.5,maxv:3,se:1.3,spe:.2},comp:{acc:2.5,maxv:2.5,se:1}},
  "200":{gpp:{acc:2,maxv:1.5,se:2,spe:1.2,lac:.3},spp:{acc:1.3,maxv:2.4,se:3,spe:1.4,lac:.4},comp:{acc:1.5,maxv:2.2,se:2.4,spe:1,lac:.2}},
  "400":{gpp:{acc:1.2,maxv:1.4,se:2.2,spe:2.2,lac:1},spp:{acc:.6,maxv:1.4,se:2.2,spe:3,lac:2.2},comp:{acc:1,maxv:1.4,se:2.2,spe:2.2,lac:1.4}},
  "SH":{gpp:{acc:2,maxv:1.2,hStart:1.5,hRhythm:2.2,se:1},spp:{acc:1.5,maxv:2,hStart:2.6,hRhythm:2.2,se:1,hSE:1},comp:{acc:1.5,maxv:1.6,hStart:2.6,hRhythm:1.6,hSE:.8}},
  "400H":{gpp:{maxv:1,se:2,spe:2,hRhythm:1.6,hStride:1.5,lac:.8},spp:{maxv:1,se:2,spe:2.4,hStride:2.6,hSE:2,lac:2},comp:{maxv:1.2,se:2,spe:2,hStride:2.2,hSE:2,lac:1.2}}
};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_LONG=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY_OPTS=[{k:"track",n:"Track"},{k:"both",n:"Track + Gym"},{k:"gym",n:"Gym"},{k:"rest",n:"Rest"}];
const NIGGLE_AREAS=["Hamstring","Calf / Achilles","Hip / Groin","Quad","Knee","Foot / Ankle","Back","Other"];

/* ---------- storage: one key per profile ---------- */
const K_INDEX="sc2:index", K_PROFILE=id=>"sc2:p:"+id;
function lsGet(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
let INDEX=lsGet(K_INDEX)||{active:null,profiles:[]};
let S=null; // active profile data
let ui={tab:"week",weekOffset:0,sheet:null,filter:"all",prefill:null,importRows:null,importText:"",importYear:new Date().getFullYear(),chartDist:null,setup:null};

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function blankProfile(){
  return{version:DATA_VERSION,id:newId(),created:iso(new Date()),
    profile:{name:"",sex:"M",dob:"",event:"",secondaries:[],priorities:[],hRace:"",hRaceLong:"",hSpec:{h:"",first:"",sp:""},mode:"app",
      goal:{type:"continual",champ:"",indoor:""},
      blockStart:iso(mondayOf(new Date())),seasonStart:defaultSeasonStart(),

/* ---------- dates ---------- */
function iso(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function parseISO(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}

function weeksBetween(a,b){return Math.round((mondayOf(b)-mondayOf(a))/(7*864e5));}
function dow(d){return(d.getDay()+6)%7;}
function fmtDay(d){return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});}

/* ---------- times ---------- */
function parseTime(str){
  if(str==null)return null;str=String(str).trim().replace(/[a-z]+$/i,"");if(!str)return null;
  const m=str.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);if(m)return Number(m[1])*60+Number(m[2]);
  const n=Number(str);return isFinite(n)&&n>0?n:null;
}

// Like Power of 10: electronic and hand-timed bests are kept separately.
function bests(ev){

  const best=a=>a.reduce((b,r)=>!b||r.secs<b.secs?r:b,null);
  const fat=list.filter(r=>r.timing!=="HT"),hand=list.filter(r=>r.timing==="HT");

  const pbF=best(fat),pbH=best(hand),sbF=best(inSeason(fat)),sbH=best(inSeason(hand));

// for coaching comparisons, use the fastest mark once hand times are converted to electronic
// Wind-assisted marks: rough tailwind benefit per m/s (published models), used cautiously.
const WIND_K={"100m":0.055,"200m":0.05,"70mH":0.05,"75mH":0.05,"80mH":0.05,"100mH":0.055,"110mH":0.055};

const LEVELS={M:{"60m":[6.75,6.95,7.25],"100m":[10.4,10.8,11.4],"200m":[20.9,21.7,22.9],"400m":[46.5,48.5,51],"110mH":[14,14.8,16],"400mH":[51,54,58]},
  F:{"60m":[7.4,7.65,8.0],"100m":[11.5,12,12.7],"200m":[23.3,24.4,25.9],"400m":[52.5,55.5,59],"100mH":[13.3,14,15.2],"400mH":[58,62,67]}};

/* ---------- season structure ---------- */
let SEG_CACHE=null;
function segments(){

  const p=S.profile;const start=mondayOf(parseISO(p.blockStart)||new Date());
  const segs=[];let cur=start;
  const add=(ph,weeks,extra={})=>{weeks=Math.max(0,Math.round(weeks));if(!weeks)return;segs.push({p:ph,start:cur,weeks,...extra});cur=addDays(cur,7*weeks);};
  const wk=s=>weeksBetween(start,parseISO(s));

    const iw=wk(g.indoor),ow=wk(g.champ);
    const c1=Math.min(4,iw+1),s1=Math.min(4,iw+1-c1),g1=iw+1-c1-s1;
    add("gpp",g1);add("spp",s1);add("comp",c1,{peak:true,label:"Indoor peak"});
    let rem=ow-iw;const t1=Math.min(1,rem);rem-=t1;const c2=Math.min(8,rem);rem-=c2;const s2=Math.min(6,rem);rem-=s2;
    add("trans",t1);add("gpp",rem);add("spp",s2);add("comp",c2,{peak:true,label:"Outdoor peak"});add("trans",3);add("gpp",40);
  }else if((g.type==="peak"||g.type==="double")&&g.champ&&wk(g.champ)>=0){
    const cw=wk(g.champ);const c=Math.min(8,cw+1),s=Math.min(6,cw+1-c),gp=cw+1-c-s;
    add("gpp",gp);add("spp",s);add("comp",c,{peak:true,label:"Championship peak"});add("trans",3);add("gpp",40);
  }else{
    add("gpp",6);for(let i=0;i<12;i++){add("spp",4,{rolling:true});add("comp",4,{rolling:true});}
  }

    return{p:s.p,week,weeks:s.weeks,seg:s,abs:weeksBetween(segs[0].start,m),deload,taper};}}

}
function ramadanOn(dISO){const r=S.profile.ramadan;return r.on&&r.start&&r.end&&dISO>=r.start&&dISO<=r.end;}
function activeNiggles(dISO){return S.niggles.filter(n=>n.start<=dISO&&(!n.cleared||n.cleared>dISO));}

/* ---------- coaching analysis ---------- */
function analyse(){
  const p=S.profile;const F=p.sex==="F";const fams=new Set(allEvents(p).map(famOf));
  const t={};EVENTS.forEach(e=>t[e]=pbT(e));
  const adjusted=EVENTS.map(e=>({e,i:pbInfo(e)})).filter(x=>x.i&&x.i.adjusted).map(x=>`${x.e}: ${fmtMark(x.i.r)} (+${Number(x.i.r.wind).toFixed(1)}) ≈ ${fmtTime(x.i.t)} adjusted`);

  const findings=[],missing=[];
  const add=(c,title,ratio,text)=>findings.push({c,title,ratio,text});
  if(t["60m"]&&t["100m"]){const r=t["100m"]/t["60m"];
    if(r>1.56){w.maxv+=.8;w.se+=.2;add("var(--t-maxv)","Your 100m fades compared with your 60m",`100m ÷ 60m = ${r.toFixed(3)}`,"Your start is ahead of your top-end speed. More flying sprints and speed maintenance will help you hold speed to the line.");}
    else if(r<1.525){w.acc+=.8;w.hStart+=.3;add("var(--t-acc)","Your first 60m is the weaker part",`100m ÷ 60m = ${r.toFixed(3)}`,"You finish strongly but lose ground early. Extra block starts and acceleration work to 30–40m should pay off.");}
    else add("var(--good)","Start and top speed are balanced",`100m ÷ 60m = ${r.toFixed(3)}`,"Your 60m and 100m match well, so no extra weighting either way.");
  }else if(fams.has("100")||fams.has("SH")||fams.has("200"))missing.push("60m and 100m");
  if(t["100m"]&&t["200m"]){const d=t["200m"]-2*t["100m"];
    if(d>0.4){w.se+=.8;add("var(--t-se)","Your 200m doesn't match your 100m speed",`200m − 2 × 100m = +${d.toFixed(2)}s`,"You have the speed but lose it over the bend and home straight. Speed endurance (80–150m at 95%) gets more weight.");}
    else if(d<-0.1){w.maxv+=.5;w.acc+=.3;add("var(--t-maxv)","Your 200m is ahead of your 100m",`200m − 2 × 100m = ${d.toFixed(2)}s`,"You carry speed well, so raw speed is the limiter. Max velocity work gets more weight.");}
    else add("var(--good)","100m and 200m are well matched",`200m − 2 × 100m = ${d>=0?"+":""}${d.toFixed(2)}s`,"Your speed carries into the 200m as expected.");
  }else if(!(fams.size===1&&fams.has("400H")))missing.push("100m and 200m");
  if(t["200m"]&&t["400m"]){const d=t["400m"]-2*t["200m"];
    if(d>4.5){w.spe+=.8;w.lac+=.5;w.hSE+=.3;add("var(--t-spe)","Your 400m isn't using your 200m speed",`400m − 2 × 200m = +${d.toFixed(2)}s`,"There's a big speed reserve left on the table. Special endurance (250–350m) and lactic work get more weight.");}
    else if(d<3.2){w.maxv+=.5;w.se+=.4;add("var(--t-maxv)","Your 400m is strong for your 200m",`400m − 2 × 200m = +${d.toFixed(2)}s`,"Your endurance is good. Raising your top speed and speed endurance is the quickest route to a faster 400m.");}
    else add("var(--good)","200m and 400m are balanced",`400m − 2 × 200m = +${d.toFixed(2)}s`,"Your 400m is about where your 200m speed suggests.");
  }else if(fams.has("400")||fams.has("400H")||fams.has("200"))missing.push("200m and 400m");
  const hEv=fams.has("SH")?hurdleRace(p,"SH"):null;
  if(hEv&&(hEv==="100mH"||hEv==="110mH")){

      else if(d<lo){w.maxv+=.6;w.acc+=.4;add("var(--t-maxv)","Your hurdling is efficient. Flat speed is the limiter",`${hEv} − 100m = +${d.toFixed(2)}s`,"You convert your speed well over the barriers. Getting faster on the flat is the quickest route to a faster hurdles time.");}
      else add("var(--good)","Hurdles and flat speed are well matched",`${hEv} − 100m = +${d.toFixed(2)}s`,"Your hurdle differential is in a normal range.");
    }else missing.push(hEv+" and 100m");
    if(t["60mH"]&&t["60m"]){const d=t["60mH"]-t["60m"];if(d>(F?1.15:1.3)){w.hStart+=.6;add("var(--t-hurdle)","Your 60mH loses time early",`60mH − 60m = +${d.toFixed(2)}s`,"Starts and the run-in to hurdles 1–2 get more weight.");}}
  }
  if(fams.has("400H")&&hurdleRace(p,"400mH")==="400mH"){

      if(d>(F?4.5:4.0)){w.hStride+=.8;w.hSE+=.5;add("var(--t-hurdle)","Your 400mH is well off your flat 400m",`400mH − 400m = +${d.toFixed(2)}s`,"Rhythm under fatigue is costing you: stride pattern work and hurdle speed endurance get more weight.");}
      else if(d<2.5){w.se+=.5;w.spe+=.4;add("var(--t-se)","Your hurdling is efficient. Flat 400m is the limiter",`400mH − 400m = +${d.toFixed(2)}s`,"Raising your flat 400m speed and endurance is the quickest route to a faster 400mH.");}
      else add("var(--good)","400mH and 400m are well matched",`400mH − 400m = +${d.toFixed(2)}s`,"Your hurdle differential is in a normal range.");

}
let RANK_CACHE={};
function phKeyOf(k){return k==="trans"?"gpp":k;}
function rankedQuality(phKey){
  if(RANK_CACHE[phKey])return RANK_CACHE[phKey];
  const p=S.profile;const {w}=analyse();const pk=phKeyOf(phKey);const base={};
  const addEmph=(f,m)=>{const e=EMPH[f][pk];for(const k in e)base[k]=(base[k]||0)+e[k]*m;};
  addEmph(fam(p),1);(p.secondaries||[]).forEach(k=>addEmph(famOf(k),0.35));
  (p.priorities||[]).forEach(k=>{base[k]=(base[k]||1)*1.6;});
  const ag=ageGroup(p);
  if(ag&&ag.youth){if(ag.young){base.lac=0;if(base.spe)base.spe*=0.5;}else if(base.lac)base.lac*=0.5;}
  if(ag&&ag.masters&&base.lac)base.lac*=0.6;
  const r=Object.keys(base).filter(k=>QUAL_OK(k)).map(k=>({k,s:base[k]*(w[k]||1)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);

function QUAL_OK(k){return !TYPES[k].hurdle||isHurdler(S.profile);}
// Speed is never dropped: the dose depends on speed reserve, level, age and coach priorities.
function speedDose(ph,raceWeek){
  const p=S.profile;
  if(ph.p==="trans")return{dose:"none",why:"Transition weeks are easy running only."};
  if(ph.taper||raceWeek)return{dose:"sharpen",why:(ph.taper?"Taper":"Race week")+": short, fast speed work at low volume keeps you sharp."};
  if((p.priorities||[]).some(k=>k==="acc"||k==="maxv"))return{dose:"develop",why:"Your coach has made speed a priority, so it gets a full session every week."};
  const ag=ageGroup(p);
  if(ag&&ag.youth)return{dose:"develop",why:`${ag.code}: speed develops fastest at this age, so it gets a full session every week.`};
  const f=fam(p);
  if(f==="100"||f==="SH")return{dose:"develop",why:"Speed is the heart of your event, so it gets a full session every week."};
  let score=0;const reasons=[];
  if(f==="400"||f==="400H"){const t2=pbT("200m"),t4=pbT("400m");
    if(t2&&t4){const d=t4-2*t2;if(d>4.5){score--;reasons.push(`your 400m is ${d.toFixed(1)}s slower than twice your 200m, so speed endurance is where the time is`);}
      else if(d<3.2){score++;reasons.push(`your 400m is strong for your speed (${d.toFixed(1)}s off twice your 200m), so more speed is the quickest gain`);}
      else reasons.push(`your 400m is ${d.toFixed(1)}s off twice your 200m, a normal balance`);}
    else{score++;reasons.push("add 200m and 400m PBs to fine-tune this");}
  }else{const t1=pbT("100m"),t2=pbT("200m");
    if(t1&&t2){const d=t2-2*t1;if(d>0.4){score--;reasons.push("your 200m fades from your 100m speed");}else{score++;reasons.push("speed is the limiter for your 200m");}}else score++;}
  const lv=athleteLevel();
  if(lv&&lv.level!=="youth"){if(lv.level==="elite"||lv.level==="national"){score--;reasons.push(`at ${lv.level} level there's less speed left to gain cheaply`);}else{score++;reasons.push(`at ${lv.level} level speed is still very trainable`);}}

}

/* ---------- weekly plan ---------- */
let WEEK_CACHE={};
function baseWeek(monday){
  const key=iso(monday);if(WEEK_CACHE[key])return WEEK_CACHE[key];
  const p=S.profile;const ph=phaseAt(monday);
  const dayISO=i=>iso(addDays(monday,i));
  const raceIdx=[];for(let i=0;i<7;i++)if(compsOn(dayISO(i)).length)raceIdx.push(i);
  const track=[];for(let i=0;i<7;i++){if(p.days[i]==="track"||p.days[i]==="both")track.push(i);}
  let q=track.length>=5?3:track.length>=3?2:track.length;
  if(ph.p==="trans")q=0;
  if((ph.deload||ph.taper)&&q>1)q-=1;
  if(raceIdx.length)q=Math.min(q,raceIdx.length>1?1:2);
  if(ramadanOn(dayISO(3))&&q>2)q=2;
  const ag=ageGroup(p);if(ag&&((ag.masters&&ag.age>=45)||ag.young)&&q>2)q=2;
  const blocked=new Set();raceIdx.forEach(r=>{blocked.add(r);blocked.add(r-1);blocked.add(r+1);});
  const qDays=[];
  for(const i of track){if(qDays.length>=q)break;if(blocked.has(i))continue;if(qDays.some(j=>Math.abs(j-i)<2))continue;qDays.push(i);}
  const ranked=rankedQuality(ph.p).map(x=>x.k);
  const n=qDays.length;const abs=Math.abs(ph.abs);

/* ---------- shorthand parser: "3x150 @95% 8min", "2x(3x200) 2min/10min" ---------- */
function parseShorthand(str){
  if(!str||!str.trim())return null;
  let s=str.toLowerCase().replace(/×/g,"x").replace(/[’′]/g,"'").replace(/[”″]/g,'"');
  const segs=s.split(/[,;+]|\band\b/).map(x=>x.trim()).filter(Boolean);

  for(let seg of segs){
    let sets=1,n=0,dist=0;let m;
    if((m=seg.match(/(\d+)\s*x\s*\(\s*(\d+)\s*x\s*(\d+)\s*m?\s*\)/))){sets=+m[1];n=+m[2];dist=+m[3];}
    else if((m=seg.match(/(\d+)\s*x\s*(\d+)\s*m?(?![a-z0-9])/))){n=+m[1];dist=+m[2];}
    else if((m=seg.match(/(?:^|\s)(\d{2,3})\s*m(?![a-z])/))){n=1;dist=+m[1];}
    if(!n||!dist||dist>2000||n>40||sets>10)continue;
    const rest=seg.replace(m[0]," ");
    const pm=rest.match(/@?\s*(\d{2,3})\s*%/);const pct=pm?+pm[1]:"";
    const rests=[...rest.replace(/@?\s*\d{2,3}\s*%/,"").matchAll(/(\d+(?:\.\d+)?)\s*(minutes|mins|min|'|seconds|secs|sec|s(?![a-z])|")/g)].map(r=>{const u=r[2];return /^(s|sec|secs|seconds|")$/.test(u)?r[1]+"s":r[1]+" min";});
    const r1=rests[0]||"",r2=rests[1]||"";
    for(let a=0;a<sets;a++)for(let b=0;b<n;b++){const last=b===n-1;reps.push({dist:String(dist),pct:pct?String(pct):"",rest:last?(a<sets-1?r2||r1:""):r1,time:"",rpe:""});}
    parts.push(`${sets>1?sets+" × (":""}${n} × ${dist}m${sets>1?")":""}${pct?" @"+pct+"%":""}${r1?", "+r1+" rest":""}${r2?", "+r2+" between sets":""}`);
  }
  return reps.length?{reps,summary:parts.join(" + ")}:null;
}

  const finish=()=>{if(cur&&cur.secs&&cur.date){const venue=[cur.texts[0],cur.texts[1]].filter(Boolean).join(" · ").replace(/\.{3}$/,"…");

function parsePo10Lines(text,year){

}
function parsePo10(text,year){
  year=+year||new Date().getFullYear();
  let rows=parsePo10Blocks(text,year);
  const alt=parsePo10Lines(text,year);
  if(alt.length>rows.length)rows=alt;
  // mark duplicates of results already saved
  rows.forEach(r=>{r.dup=S.records.some(x=>x.event===r.event&&Math.abs(x.secs-r.secs)<0.005&&x.date===r.date);if(r.dup)r.pick=false;});
  return rows;
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2800);}
function dot(type,sq){return `<span class="dot${sq?" sq":""}" style="--c:${TYPES[type]?.c||"var(--t-gym)"}"></span>`;}
function repSummary(reps){if(!reps||!reps.length)return"";return reps.map(r=>`${r.dist||"?"}m${r.time?" "+fmtTime(parseTime(r.time)):""}`).join(", ");}
function logSummary(l){const parts=[TYPES[l.type]?.name||""];if(l.reps?.length)parts.push(repSummary(l.reps));if(l.notes)parts.push(l.notes);return parts.filter(Boolean).join(" · ");}
function invalidate(){SEG_CACHE=null;RANK_CACHE={};WEEK_CACHE={};}
function commit(msg){invalidate();saveAll();render();if(msg)toast(msg);}

/* =========================================================
   Rendering
   ========================================================= */
function render(){
  invalidate();
  const app=$("#app");
  if(!S||!S.profile.event||ui.setup){$("#tabs").hidden=true;app.innerHTML=setupView();bindSetup();renderSheet();return;}
  $("#tabs").hidden=false;
  $$(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===ui.tab?"page":"false"));
  app.innerHTML=appBar()+({week:weekView,races:racesView,records:recordsView,insights:insightsView,settings:settingsView})[ui.tab]();
  bindCommon();
  ({week:bindWeek,races:bindRaces,records:bindRecords,insights:bindInsights,settings:bindSettings})[ui.tab]();
  renderSheet();
}
function appBar(){
  const p=S.profile;const n=(p.name||"A").trim();
  return `<div class="appbar"><button class="who ghost" id="who" aria-label="Switch athlete"><span class="avatar">${esc(n[0].toUpperCase())}</span><span>${esc(p.name||"Athlete")} · ${esc(mainName(p))}${agLabel(p)?" · "+esc(agLabel(p)):""}</span></button><span class="brand">Sprint Coach</span></div>`;
}

function dobField(id,val){const max=todayISO();return `<label for="${id}">Date of birth<input id="${id}" type="date" max="${max}" value="${val||""}"></label>`;}

/* ---------- season strip ---------- */
function seasonStrip(focusDate){
  const segs=segments().filter(s=>s.weeks<40).slice(0,12);if(!segs.length)return"";
  const cur=phaseAt(focusDate);
  return `<div class="stack-sm"><div class="strip" aria-hidden="true">${segs.map(s=>`<span title="${PHASES[s.p].name}, ${s.weeks} wk" style="flex:${s.weeks};background:${PHASES[s.p].c};opacity:${cur.seg===s?1:.35}"></span>`).join("")}</div>
    <div class="strip-legend">${[...new Set(segs.map(s=>s.p))].map(k=>`<span><i style="background:${PHASES[k].c}"></i>${PHASES[k].name}</span>`).join("")}</div></div>`;
}

/* ---------- week ---------- */
function phasePills(ph,dISO){
  const out=[];
  if(ph.pre)out.push(`<span class="pill">Before your block starts</span>`);
  else if(ph.after)out.push(`<span class="pill">After your season plan</span>`);
  else out.push(`<span class="pill accent">${PHASES[ph.p].name} · week ${ph.week} of ${ph.weeks}</span>`);
  if(ph.seg&&ph.seg.label&&ph.seg.p==="comp")out.push(`<span class="pill">${esc(ph.seg.label)}</span>`);
  if(ph.deload)out.push(`<span class="pill good">Deload week</span>`);
  if(ph.taper)out.push(`<span class="pill good">Taper</span>`);
  if(dISO&&ramadanOn(dISO))out.push(`<span class="pill warn">Ramadan</span>`);
  return out.join(" ");
}
function weekView(){
  const p=S.profile;const monday=addDays(mondayOf(new Date()),7*ui.weekOffset);const ph=phaseAt(monday);const today=todayISO();
  const midISO=iso(addDays(monday,3));
  const showTrack=ui.filter!=="gym",showGym=ui.filter==="all"||ui.filter==="gym";
  const rows=DAYS.map((dn,i)=>{
    const d=addDays(monday,i);const k=iso(d);const pl=dayPlan(d);const log=S.logs[k]||{};
    const lt=log.track;const shownType=lt&&lt.status!=="skipped"&&lt.type?lt.type:pl.type;
    const isH=!!TYPES[shownType]?.hurdle;
    let track="";
    const trackVisible=!(shownType==="rest"&&pl.gym&&!lt)&&showTrack&&(ui.filter==="all"||(ui.filter==="hurdles"?isH:!isH))&&!(shownType==="rest"&&ui.filter!=="all");
    if(trackVisible){
      let sub=pl.src==="coach"&&pl.text?esc(pl.text):esc(presc(pl.type,pl.ph));
      if(pl.comps.length)sub=esc(pl.comps.map(c=>`${c.name||"Race"}${c.event?" · "+c.event:""}${c.priority?" ("+c.priority+")":""}`).join(", "));
      if(lt&&lt.status!=="skipped"&&(lt.status==="changed"||lt.reps?.length))sub="Did: "+esc(logSummary(lt));
      const label=S.coach[k]&&p.mode!=="app"?" · coach":"";
      track=`<div class="stack-sm"><div class="dtitle">${dot(shownType)}${TYPES[shownType].name}${label}</div><div class="dsub">${sub}</div>${!lt&&pl.why.length?`<div class="why">${esc(pl.why[pl.why.length-1])}</div>`:""}</div>`;
    }
    let gym="";
    if(showGym&&(pl.gym||log.gym)){gym=`<div class="dtitle small">${dot(null,true)}Gym${log.gym?.status==="skipped"?" (skipped)":""}</div>`;}
    if(!track&&!gym)return"";
    const st=[];
    if(lt)st.push(`<span class="status ${lt.status}">${lt.status==="done"?"Done":lt.status==="changed"?"Changed":"Skipped"}</span>`);
    else if(k<today&&!["rest","none"].includes(pl.type)&&trackVisible)st.push(`<span class="status">Not logged</span>`);
    if(log.gym&&gym)st.push(`<span class="status ${log.gym.status}">Gym ${log.gym.status==="done"?"done":"skipped"}</span>`);
    if(S.checkins[k])st.push(`<span class="status">Check-in ${S.checkins[k].sleep+S.checkins[k].sore+S.checkins[k].energy}/15</span>`);
    return `<button class="day ${k===today?"today":""}" data-day="${k}" id="day-${k}">
      <div><div class="dname">${dn}</div><div class="ddate">${fmtDay(d)}</div></div>
      <div class="dmain">${track}${gym}</div><div class="statuses">${st.join("")}</div></button>`;}).join("");
  const nig=activeNiggles(today);
  const filters=[["all","All"],["flat","Flat"],...(isHurdler(p)?[["hurdles","Hurdles"]]:[]),["gym","Gym"]];
  return `<div class="stack-lg">
    <div class="spread" style="align-items:flex-end"><div class="stack-sm"><h1>${ui.weekOffset===0?"This week":ui.weekOffset===1?"Next week":ui.weekOffset===-1?"Last week":"Week of "+fmtDay(monday)}</h1>
      <div class="row" style="gap:6px">${phasePills(ph,midISO)}</div></div>
      <div class="week-nav"><button id="wk-prev" aria-label="Previous week">‹</button><button id="wk-now" class="ghost" ${ui.weekOffset===0?"disabled":""}>Today</button><button id="wk-next" aria-label="Next week">›</button></div></div>
    ${seasonStrip(monday)}
    ${ui.weekOffset===0&&!S.checkins[today]?`<div class="banner"><span><strong>How are you today?</strong> <span class="muted small">A 10-second check-in adjusts today's session.</span></span><button class="primary" id="ci-open">Check in</button></div>`:""}
    ${nig.length?`<div class="banner warn"><span><strong>Niggle:</strong> ${esc(nig.map(n=>n.area+(n.note?" ("+n.note+")":"")).join(", "))}. Max-speed and hurdle work is paused.</span><button id="nig-clear">Mark cleared</button></div>`:""}
    ${!S.records.length?`<div class="banner"><span>Add your PBs so sessions get target times and focus on what you need.</span><button class="primary" id="go-rec">Add PBs</button></div>`:""}
    <div class="spread"><div class="chips" role="group" aria-label="Filter">${filters.map(([k,n])=>`<button class="chip-btn sm" data-filter="${k}" aria-pressed="${ui.filter===k}">${n}</button>`).join("")}</div>
      <div class="row">${p.mode!=="app"?`<button class="ghost" id="copy-week">Copy last week's coach plan</button>`:""}${nig.length?"":`<button class="ghost" id="nig-open">Report a niggle</button>`}</div></div>
    <div class="days">${rows||`<p class="muted" style="padding:16px">Nothing matches this filter this week.</p>`}</div>
    <p class="sync">${({app:"Plan: Sprint Coach writes every session.",coach:"Plan: you enter your coach's sessions.",hybrid:"Plan: hybrid. Your coach's sessions come first and the app fills the gaps."})[p.mode]} Tap a day to log it.</p></div>`;
}
function bindWeek(){
  $("#wk-prev").onclick=()=>{ui.weekOffset--;render();};$("#wk-next").onclick=()=>{ui.weekOffset++;render();};$("#wk-now").onclick=()=>{ui.weekOffset=0;render();};
  $$("[data-filter]").forEach(b=>b.onclick=()=>{ui.filter=b.dataset.filter;render();});
  $$("[data-day]").forEach(b=>b.onclick=()=>openSheet({kind:"day",date:b.dataset.day,mode:"view"}));
  const g=$("#go-rec");if(g)g.onclick=()=>{ui.tab="records";render();};
  const ci=$("#ci-open");if(ci)ci.onclick=()=>openSheet({kind:"day",date:todayISO(),mode:"view"});
  const no=$("#nig-open");if(no)no.onclick=()=>openSheet({kind:"niggle"});
  const nc=$("#nig-clear");if(nc)nc.onclick=()=>{const t=todayISO();activeNiggles(t).forEach(n=>n.cleared=t);commit("Niggle cleared. Full sessions are back.");};
  const cw=$("#copy-week");if(cw)cw.onclick=()=>{const monday=addDays(mondayOf(new Date()),7*ui.weekOffset);let n=0;
    for(let i=0;i<7;i++){const from=iso(addDays(monday,i-7)),to=iso(addDays(monday,i));if(S.coach[from]&&!S.coach[to]){S.coach[to]=JSON.parse(JSON.stringify(S.coach[from]));n++;}}
    commit(n?`Copied ${n} coach session${n>1?"s":""} from last week.`:"Nothing to copy from last week.");};
}

/* ---------- day sheet ---------- */
function openSheet(s){ui.sheet=s;
  if(s.kind==="day"){const pl=dayPlan(parseISO(s.date));const l=S.logs[s.date]?.track;const c=S.coach[s.date];
    s.draft=l?{type:l.type||pl.type,reps:JSON.parse(JSON.stringify(l.reps||[])),notes:l.notes||"",src:l.src||"app"}:{type:["rest","none"].includes(pl.type)?"tempo":pl.type,reps:pl.reps?JSON.parse(JSON.stringify(pl.reps)):[],notes:"",src:pl.src==="coach"?"coach":"app"};
    s.coachDraft=c?{type:c.type,text:c.text||"",gym:c.gym||"",tpl:false,tplName:""}:{type:"se",text:"",gym:"",tpl:false,tplName:""};
    s.ci=S.checkins[s.date]?{...S.checkins[s.date]}:{sleep:0,sore:0,energy:0};}
  renderSheet();}
function closeSheet(){ui.sheet=null;renderSheet();}
function renderSheet(){
  const root=$("#sheet-root");const s=ui.sheet;if(!s||!S){root.innerHTML="";return;}
  let inner="";
  if(s.kind==="day")inner=daySheet(s);
  else if(s.kind==="niggle")inner=niggleSheet();
  else if(s.kind==="profiles")inner=profilesSheet();
  root.innerHTML=`<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">${inner}</div></div>`;
  $("#sheet-bg").onclick=e=>{if(e.target.id==="sheet-bg")closeSheet();};
  const c=$("#sh-close");if(c)c.onclick=closeSheet;
  if(s.kind==="day")bindDaySheet(s);else if(s.kind==="niggle")bindNiggleSheet();else if(s.kind==="profiles")bindProfilesSheet();
}
function typeOptions(sel,list){return list.filter(k=>!TYPES[k].hurdle||isHurdler(S.profile)).map(k=>`<option value="${k}" ${sel===k?"selected":""}>${TYPES[k].name}</option>`).join("");}

  if(s.mode==="coach"){const c=s.coachDraft;const parsed=parseShorthand(c.text);
    return head+`${S.templates.length?`<label for="co-tpl">Use a saved session<select id="co-tpl"><option value="">Choose…</option>${S.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>`:""}
      <label for="co-type">Session type<select id="co-type">${typeOptions(c.type,LOGGABLE)}</select></label>
      <label for="co-text">Session<input id="co-text" value="${esc(c.text)}" placeholder="e.g. 3x150 @95% 8min, 4x30 fly 6min" autocomplete="off"></label>

/* ---------- insights ---------- */
function progressData(dist){
  const pts=[];
  for(const [k,l] of Object.entries(S.logs)){const reps=l.track?.reps||[];let best=null;
    for(const r of reps){if(String(r.dist)!==String(dist))continue;const t=parseTime(r.time);if(t&&(!best||t<best))best=t;}
    if(best)pts.push({date:k,t:best});}
  return pts.sort((a,b)=>a.date.localeCompare(b.date));
}
function distances(){const c={};for(const l of Object.values(S.logs))for(const r of (l.track?.reps||[]))if(r.dist&&parseTime(r.time))c[r.dist]=(c[r.dist]||0)+1;return Object.keys(c).sort((a,b)=>+a-+b);}
function lineChart(pts,label,one,none){
  if(pts.length<2)return `<p class="muted small">${pts.length?(one||"One timed rep so far. Log another to see a trend."):(none||"No timed reps at this distance yet.")}</p>`;
  const W=640,H=220,L=48,R=14,T=14,B=30;
  const xs=pts.map(p=>parseISO(p.date).getTime()),ys=pts.map(p=>p.t);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+864e5;
  let y0=Math.min(...ys),y1=Math.max(...ys);const pad=Math.max((y1-y0)*0.15,0.05);y0-=pad;y1+=pad;
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>T+(v-y0)/(y1-y0)*(H-T-B); // faster (lower) times sit higher
  const ticks=4;const yt=[...Array(ticks+1)].map((_,i)=>y0+(y1-y0)*i/ticks);
  const xt=[x0,(x0+x1)/2,x1];
  const path=pts.map((p,i)=>`${i?"L":"M"}${X(xs[i]).toFixed(1)},${Y(p.t).toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${yt.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${fmtTime(v)}</text>`).join("")}
    ${xt.map((v,i)=>`<text x="${X(v).toFixed(1)}" y="${H-8}" text-anchor="${i===0?"start":i===2?"end":"middle"}">${fmtDay(new Date(v))}</text>`).join("")}
    <path class="ln" d="${path}"/>
    ${pts.map((p,i)=>`<circle class="pt" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.t).toFixed(1)}" r="5"/><circle class="pt hit" data-tip="${fmtDate(p.date)}: ${fmtTime(p.t)}" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.t).toFixed(1)}" r="16"/>`).join("")}
  </svg><div class="tip muted" id="tip">Tap a point to see the time. Higher on the chart is faster.</div>`;
}
function insightsView(){
  const p=S.profile;const a=analyse();const ph=phaseAt(new Date());
  const ranked=rankedQuality(ph.p);const max=Math.max(...ranked.map(x=>x.s),1);
  const pick=baseWeek(mondayOf(new Date())).days.map(d=>d.type);
  const dists=distances();if(!ui.chartDist||!dists.includes(ui.chartDist))ui.chartDist=dists[0]||null;
  const raceList=S.records.filter(r=>r.event===mainName(p)&&windLegal(r)).map(r=>({date:r.date,t:fatEq(r)})).sort((x,y)=>x.date.localeCompare(y.date));
  return `<div class="stack-lg"><div class="stack-sm"><div class="eyebrow">Insights</div><h1>What you need to work on</h1>
    <p class="muted">Built from your PBs, your events (${esc(eventLabel(p))}) and where you are in the season. Hand times are converted to electronic before comparing.</p></div>
    ${(p.priorities||[]).length?`<div class="panel finding"><div class="bar" style="--c:var(--accent)"></div><div class="stack-sm"><span class="eyebrow">Coach priorities</span><h3>${p.priorities.map(k=>esc(TYPES[k].name)).join(" and ")}</h3><p>Guaranteed in your plan ${S.profile.days.filter(x=>x==="track"||x==="both").length>=4?"every week":"every other week"}, whatever the comparisons below say.</p></div></div>`:""}
    ${(()=>{const wb=baseWeek(mondayOf(new Date()));const d=wb.dose;const lv=athleteLevel();const names={develop:"Develop",maintain:"Maintain",sharpen:"Sharpen",none:"Rest"};
      return `<div class="panel finding"><div class="bar" style="--c:var(--t-maxv)"></div><div class="stack-sm"><span class="eyebrow">Speed this week</span><h3>${names[d.dose]}</h3><p>${esc(d.why)}</p>${lv&&lv.level!=="youth"?`<p class="small muted">Level: ${lv.level}, from your ${esc(lv.ev)} of ${fmtTime(lv.t)}${lv.graded?" (age-graded, approximate)":""}.</p>`:""}</div></div>`;})()}
    ${a.adjusted.length?`<div class="panel"><p class="small muted"><strong>Wind-adjusted marks in use:</strong> ${esc(a.adjusted.join("; "))}. Used only where you have no legal mark or this is clearly faster. Winds over +4.0 are ignored.</p></div>`:""}
    ${a.findings.map(f=>`<div class="panel finding"><div class="bar" style="--c:${f.c}"></div><div class="stack-sm"><h3>${esc(f.title)}</h3><div class="ratio">${esc(f.ratio)}</div><p>${esc(f.text)}</p></div></div>`).join("")}
    ${a.missing.length?`<div class="panel"><p class="muted">Add PBs for ${esc(a.missing.join("; "))} to unlock ${a.findings.length?"more":"these"} comparisons.</p></div>`:""}
    <div class="panel stack"><div class="spread"><h3>Quality work emphasis</h3><span class="small muted">${PHASES[ph.p].name}</span></div>
      <div class="focus-bars">${ranked.map(x=>`<div class="fb"><span>${TYPES[x.k].name}</span><div class="track"><div class="fill" style="--c:${TYPES[x.k].c};width:${Math.round(x.s/max*100)}%"></div></div><span class="muted">${pick.includes(x.k)?"✓":""}</span></div>`).join("")}</div>
      <p class="small muted">Ticked sessions are in this week's plan. The last one rotates week to week.</p></div>
    <div class="panel stack"><h3>Your season</h3>${seasonStrip(new Date())}
      <div class="small muted">${segments().filter(s=>s.weeks<40).slice(0,10).map(s=>`${PHASES[s.p].short} from ${fmtDay(s.start)} (${s.weeks} wk)`).join(" · ")}</div></div>
    <div class="panel stack"><div class="spread"><h3>Training progress</h3>${dists.length?`<label for="pr-dist" style="flex-direction:row;align-items:center">Distance <select id="pr-dist" style="width:auto">${dists.map(d=>`<option value="${d}" ${d===ui.chartDist?"selected":""}>${d}m</option>`).join("")}</select></label>`:""}</div>
      ${ui.chartDist?lineChart(progressData(ui.chartDist),`Best ${ui.chartDist}m rep time per session`):`<p class="muted small">Log reps with times and your best rep at each distance appears here over the season.</p>`}</div>
    <div class="panel stack"><h3>${esc(mainName(p))} race results</h3>${lineChart(raceList,mainName(p)+" results over time","One result so far. Add more to see your progression.","Add your "+mainName(p)+" results under Records to see your progression.")}</div></div>`;
}
function bindInsights(){const d=$("#pr-dist");if(d)d.onchange=()=>{ui.chartDist=d.value;render();};
  $$(".pt.hit").forEach(c=>c.onclick=()=>{const t=c.closest(".panel").querySelector(".tip");if(t)t.textContent=c.dataset.tip;});}

/* ---------- settings ---------- */
function settingsView(){
  const p=S.profile;const r=p.ramadan;
  return `<div class="stack-lg"><div class="stack-sm"><div class="eyebrow">Settings</div><h1>Athlete and season</h1></div>
    <div class="panel stack"><h3>Athlete</h3>
      <div class="grid2"><label for="s-name">Name<input id="s-name" value="${esc(p.name)}"></label>
      <div class="stack-sm"><span class="lbl">Sex</span><div class="chips">${[["M","Male"],["F","Female"]].map(([k,n])=>`<button type="button" class="chip-btn sm" data-ssx="${k}" aria-pressed="${p.sex===k}">${n}</button>`).join("")}</div></div>
      ${dobField("s-dob",p.dob)}<p class="small muted" style="align-self:end">${agLabel(p)?`Age group: <strong>${esc(agLabel(p))}</strong> (UK Athletics). It updates automatically each season.`:"Add a date of birth to set your UK Athletics age group."}</p></div>
      ${eventPickers(p,"s")}
      ${isHurdler(p)?(()=>{const hs=hurdleSpec(p);const ev=hurdleEv(p);const races=ev==="SH"?SH_RACES:LH_RACES;const cur=hurdleRace(p,ev);
        return `<hr><div class="stack-sm"><span class="lbl">Hurdles</span>
        <div class="grid2"><label for="s-hrace">Your ${ev==="SH"?"sprint hurdles":"long hurdles"} race<select id="s-hrace">${races.map(r=>`<option ${r===cur?"selected":""}>${r}</option>`).join("")}</select></label>
        <p class="small muted" style="align-self:end">${hs&&!hs.custom?`Standard specs: ${hs.h.toFixed(3)}m, ${hs.first}m to H1, ${hs.sp}m apart.`:hs&&hs.custom?"Using your own specs below.":"Enter your race's specs below. Youth and masters heights and spacings vary, so check the current UK Athletics rules."}</p></div>
        <div class="grid3"><label for="s-hh">Height (m)<input id="s-hh" inputmode="decimal" value="${esc(p.hSpec.h)}" placeholder="${hs&&!hs.custom?hs.h.toFixed(3):"e.g. 0.840"}"></label>
        <label for="s-hf">To first hurdle (m)<input id="s-hf" inputmode="decimal" value="${esc(p.hSpec.first)}" placeholder="${hs&&!hs.custom&&hs.first?hs.first:"e.g. 12"}"></label>
        <label for="s-hs">Spacing (m)<input id="s-hs" inputmode="decimal" value="${esc(p.hSpec.sp)}" placeholder="${hs&&!hs.custom&&hs.sp?hs.sp:"e.g. 8"}"></label></div>
        <p class="small muted">Leave these blank to use the standard senior or under-20 specs.</p></div>`;})():""}
    </div>
    <div class="panel stack"><h3>Coach's priorities</h3>
      <p class="small muted">Pick up to two qualities your plan must not neglect. They're guaranteed a session every week with 4 or more track days, otherwise every other week, and they come first in Insights.</p>
      <div class="chips">${ORDER.filter(QUAL_OK).map(k=>{const on=(p.priorities||[]).includes(k);return `<button type="button" class="chip-btn sm" data-prio="${k}" aria-pressed="${on}" ${!on&&(p.priorities||[]).length>=2?"disabled":""}>${TYPES[k].name}</button>`;}).join("")}</div></div>
    <div class="panel stack"><h3>Goal</h3>${goalPicker(p.goal.type,p.goal.champ,p.goal.indoor,"s")}</div>
    <div class="panel stack"><h3>Who writes the plan</h3>
      ${[["app","Sprint Coach","The app writes every session from your event, goal and PBs."],["coach","My coach","You enter your coach's sessions. The app is your log and tracker."],["hybrid","Hybrid","The app plans every day. When you enter or log a session from your coach, it takes priority and the app rebalances the rest of the week."]].map(([k,n,t])=>`<label class="check" for="s-m-${k}" style="align-items:flex-start"><input type="radio" name="s-mode" id="s-m-${k}" value="${k}" ${p.mode===k?"checked":""}><span><strong>${n}</strong><br><span class="small muted">${t}</span></span></label>`).join("")}
      ${S.templates.length?`<div class="stack-sm"><span class="lbl">Saved coach sessions</span>${S.templates.map(t=>`<div class="spread"><span>${esc(t.name)} <span class="small muted">· ${esc(t.text)}</span></span><button class="link" data-deltpl="${t.id}">Delete</button></div>`).join("")}</div>`:""}</div>
    <div class="panel stack"><h3>Training days</h3>${daysEditor(p.days,"s")}</div>
    <div class="panel stack"><h3>Season</h3>
      <div class="grid2"><label for="s-block">Training block starts<input id="s-block" type="date" value="${p.blockStart}"></label>
      <label for="s-season">Season's bests count from<input id="s-season" type="date" value="${p.seasonStart}"></label></div>
      <label class="check" for="s-deload"><input type="checkbox" id="s-deload" ${p.deload?"checked":""}>Deload week every 4th week</label>
      ${seasonStrip(new Date())}</div>
    <div class="panel stack"><h3>Ramadan</h3>
      <label class="check" for="s-ram"><input type="checkbox" id="s-ram" ${r.on?"checked":""}>I'm observing Ramadan this season</label>
      <div class="stack" ${r.on?"":"hidden"}>
        <p class="small muted">The dates move each year, so enter them yourself. During Ramadan, volume drops by about a third, lactic and long reps are swapped for short speed endurance, and speed work stays short and sharp.</p>
        <div class="grid3"><label for="s-ram-s">Starts<input id="s-ram-s" type="date" value="${r.start}"></label><label for="s-ram-e">Ends<input id="s-ram-e" type="date" value="${r.end}"></label>
        <label for="s-ram-t">I'll train<select id="s-ram-t"><option value="iftar" ${r.timing==="iftar"?"selected":""}>After iftar</option><option value="afternoon" ${r.timing==="afternoon"?"selected":""}>Late afternoon</option><option value="suhoor" ${r.timing==="suhoor"?"selected":""}>After suhoor</option></select></label></div></div></div>
    <div class="panel stack"><h3>Backup</h3><p class="small muted">Everything is stored on this device. Export a backup now and then, especially before changing devices.</p>
      <div class="row"><button id="b-export">Export backup</button></div>
      <label for="b-import" class="small">Restore a backup (replaces this athlete's data)<input id="b-import" type="file" accept="application/json,.json"></label>
      <p class="sync">Sprint Coach version 2.1. Works offline once opened.</p></div>
    <div class="panel stack"><h3>Athletes</h3><div class="row"><button id="s-switch">Switch or add athlete</button>${INDEX.profiles.length>1?`<button class="ghost danger" id="s-delprof">Delete ${esc(p.name||"this athlete")}</button>`:""}</div></div></div>`;
}
function bindSettings(){
  const p=S.profile;
  $("#s-name").onchange=e=>{p.name=e.target.value.trim();commit();};
  $$("[data-ssx]").forEach(b=>b.onclick=()=>{p.sex=b.dataset.ssx;commit();});
  $$("[data-s-ev]").forEach(b=>b.onclick=()=>{p.event=b.dataset.sEv;p.secondaries=(p.secondaries||[]).filter(k=>k!==p.event);if(!QUAL_OK("hStart"))p.priorities=(p.priorities||[]).filter(QUAL_OK);commit(`Plan switched to ${mainName(p)}.`);});
  $$("[data-s-sec]").forEach(b=>b.onclick=()=>{toggleSec(p,b.dataset.sSec);p.priorities=(p.priorities||[]).filter(QUAL_OK);commit("Events updated.");});
  $$("[data-prio]").forEach(b=>b.onclick=()=>{const k=b.dataset.prio;p.priorities=p.priorities||[];const i=p.priorities.indexOf(k);if(i>=0)p.priorities.splice(i,1);else if(p.priorities.length<2)p.priorities.push(k);commit("Priorities updated. The plan has been adjusted.");});
  $("#s-dob").onchange=e=>{p.dob=e.target.value;commit(agLabel(p)?`Age group: ${agLabel(p)}.`:"");};
  const hr=$("#s-hrace");if(hr)hr.onchange=()=>{if(hurdleEv(p)==="SH")p.hRace=hr.value;else p.hRaceLong=hr.value;commit();};
  [["#s-hh","h"],["#s-hf","first"],["#s-hs","sp"]].forEach(([id,k])=>{const el=$(id);if(el)el.onchange=()=>{p.hSpec[k]=el.value.trim();commit("Hurdle specs saved.");};});
  $$("input[name='s-goal']").forEach(r=>r.onchange=()=>{p.goal.type=r.value;commit("Goal updated.");});
  const gc=$("#s-champ");if(gc)gc.onchange=()=>{p.goal.champ=gc.value;commit("Season rebuilt around the new date.");};
  const gi=$("#s-indoor");if(gi)gi.onchange=()=>{p.goal.indoor=gi.value;commit("Season rebuilt around the new date.");};
  $$("input[name='s-mode']").forEach(r=>r.onchange=()=>{p.mode=r.value;commit("Plan mode updated.");});
  $$("[data-deltpl]").forEach(b=>b.onclick=()=>{S.templates=S.templates.filter(t=>t.id!==b.dataset.deltpl);commit("Saved session deleted.");});
  $$("[data-day-i][data-pre='s']").forEach(b=>b.onclick=()=>{p.days[+b.dataset.dayI]=b.dataset.dayV;commit();});
  $("#s-block").onchange=e=>{if(e.target.value){p.blockStart=iso(mondayOf(parseISO(e.target.value)));commit("Season rebuilt.");}};
  $("#s-season").onchange=e=>{if(e.target.value){p.seasonStart=e.target.value;commit();}};
  $("#s-deload").onchange=e=>{p.deload=e.target.checked;commit();};
  $("#s-ram").onchange=e=>{p.ramadan.on=e.target.checked;commit();};
  $("#s-ram-s").onchange=e=>{p.ramadan.start=e.target.value;if(e.target.value&&!p.ramadan.end)p.ramadan.end=iso(addDays(parseISO(e.target.value),29));commit("Ramadan dates saved.");};
  $("#s-ram-e").onchange=e=>{p.ramadan.end=e.target.value;commit("Ramadan dates saved.");};
  $("#s-ram-t").onchange=e=>{p.ramadan.timing=e.target.value;commit();};
  $("#b-export").onclick=exportBackup;
  $("#b-import").onchange=e=>importBackup(e.target.files[0],true);
  $("#s-switch").onclick=()=>openSheet({kind:"profiles"});
  const dp=$("#s-delprof");if(dp)dp.onclick=()=>{if(!dp.dataset.confirm){dp.dataset.confirm="1";dp.textContent="Tap again to delete for good";return;}
    try{localStorage.removeItem(K_PROFILE(S.id));}catch(e){}INDEX.profiles=INDEX.profiles.filter(x=>x.id!==S.id);const next=INDEX.profiles[0];INDEX.active=next?next.id:null;lsSet(K_INDEX,INDEX);
    S=next?loadProfile(next.id):null;ui.tab="week";render();toast("Athlete deleted.");};
}
function exportBackup(){
  const data=JSON.stringify(S,null,2);const name=`sprint-coach-${(S.profile.name||"athlete").toLowerCase().replace(/[^a-z0-9]+/g,"-")}-${todayISO()}.json`;
  try{const blob=new Blob([data],{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:"application/json"})]})){navigator.share({files:[new File([blob],name,{type:"application/json"})],title:"Sprint Coach backup"}).catch(()=>{});return;}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast("Backup saved.");}
  catch(e){toast("Couldn't export here.");}
}
function importBackup(file,replaceCurrent){
  if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const raw=JSON.parse(rd.result);const d=migrate(raw);if(!d||!d.profile)throw 0;
      if(replaceCurrent&&S){d.id=S.id;}else if(INDEX.profiles.some(x=>x.id===d.id)){d.id=newId();}
      S=d;ui.setup=null;ui.tab="week";commit("Backup restored.");}
    catch(e){toast("That file isn't a Sprint Coach backup.");}};
  rd.readAsText(file);
}

/* ---------- common ---------- */
function bindCommon(){const w=$("#who");if(w)w.onclick=()=>openSheet({kind:"profiles"});}
$$(".tabs button").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;ui.sheet=null;ui.importRows=ui.tab==="records"?ui.importRows:null;render();window.scrollTo(0,0);});

/* ---------- boot ---------- */
(function boot(){
  if(INDEX.active){S=loadProfile(INDEX.active);}
  if(!S&&INDEX.profiles.length){S=loadProfile(INDEX.profiles[0].id);}
  render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S)render();});
})();
</script>
</body>
